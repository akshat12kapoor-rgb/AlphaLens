# Applies when the combined app is launched from the AlphaLens root.
[theme]
base = "dark"
primaryColor = "#FF4B4B"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#12161E"
textColor = "#E6E9EF"

[browser]
gatherUsageStats = false

[client]
# Hide Streamlit's Deploy button; this is a local app.
toolbarMode = "minimal"

[server]
# The backtester's OHLCV CSV and the sentiment feed's headline upload are both
# small text files; Streamlit's 200MB default has no reason to apply to them.
maxUploadSize = 5
